<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark rounded square background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16162a" />
    </linearGradient>
    <!-- B letter gradient: purple → indigo-violet -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Inner glow gradient for the letter B -->
    <radialGradient id="bGlow" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Clip for rounded square -->
    <clipPath id="roundedRect">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)" />

  <!-- Glow halo behind B -->
  <ellipse cx="250" cy="256" rx="140" ry="150" fill="url(#bGlow)" opacity="0.7" />

  <!-- Letter B — thick, bold, rounded strokes using path -->
  <g filter="url(#glowFilter)">
    <path
      d="
        M 142 100
        L 142 412
        L 278 412
        C 350 412, 390 372, 390 312
        C 390 275, 370 250, 340 238
        C 366 226, 382 203, 382 170
        C 382 128, 346 100, 278 100
        Z

        M 200 162
        L 268 162
        C 308 162, 326 178, 326 202
        C 326 226, 308 244, 268 244
        L 200 244
        Z

        M 200 304
        L 200 350
        L 278 350
        C 322 350, 334 330, 334 328
        C 334 306, 316 304, 278 304
        Z
      "
      fill="url(#bGrad)"
      fill-rule="evenodd"
      opacity="0.96"
    />
  </g>

  <!-- Subtle inner highlight on B -->
  <path
    d="
      M 152 110
      L 152 240
      L 268 240
      C 295 240, 316 230, 316 202
      C 316 174, 295 162, 268 162
      L 210 162
      L 210 110
      Z
    "
    fill="white"
    opacity="0.08"
    fill-rule="evenodd"
  />
</svg>
